services:
  degradation-check:
    image: degradation-check:auto-local
    build: .
    container_name: degradation-check
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      # 测试结果存在这里（SQLite 单文件），备份就是拷这个目录
      - ./data:/data
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
      # 页面右上角显示的实例名，随便改
      - INSTANCE_NAME=降智检测
